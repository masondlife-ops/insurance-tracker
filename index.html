<style>
  :root {
    --surface-1: #ffffff; --page: #eceef1; --text-primary: #10131a; --text-secondary: #52565f; --text-muted: #888d97; --grid: #dfe2e7; --baseline: #c2c6cd; --border: rgba(16,19,26,0.08); --card-shadow: 0 1px 3px rgba(16,19,26,0.06), 0 1px 2px rgba(16,19,26,0.08);

    --good: #0e9e46; --good-soft: rgba(14,158,70,0.14);
    --danger: #e0231e; --danger-soft: rgba(224,35,30,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-1-soft: rgba(57,135,229,0.20);
      --good: #0ca30c;
      --good-soft: rgba(12,163,12,0.16);
      --danger: #e66767;
      --danger-soft: rgba(230,103,103,0.16);
    }
  }
  :root[data-theme="dark"] {
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-1-soft: rgba(57,135,229,0.20);
    --good: #0ca30c;
    --good-soft: rgba(12,163,12,0.16);
    --danger: #e66767;
    --danger-soft: rgba(230,103,103,0.16);
  }
  :root[data-theme="light"] {
    --surface-1: #ffffff; --page: #eceef1; --text-primary: #10131a; --text-secondary: #52565f; --text-muted: #888d97; --grid: #dfe2e7; --baseline: #c2c6cd; --border: rgba(16,19,26,0.08); --card-shadow: 0 1px 3px rgba(16,19,26,0.06), 0 1px 2px rgba(16,19,26,0.08);
    --series-1: #2a78d6;
    --series-1-soft: rgba(42,120,214,0.12);
    --good: #0e9e46; --good-soft: rgba(14,158,70,0.14);
    --danger: #e0231e; --danger-soft: rgba(224,35,30,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.45;
    padding: 20px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .sub { color: var(--text-muted); font-size: 14px; }
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .month-nav { display: flex; align-items: center; gap: 2px; padding: 2px;
               border: 1px solid var(--border); background: var(--surface-1); border-radius: 9px; }
  .month-nav .btn.icon { border-color: transparent; background: transparent; padding: 4px 9px; }
  .month-nav .btn.icon:hover:not(:disabled) { background: var(--page); }
  .month-nav .label { font-size: 16px; font-weight: 600; min-width: 132px; text-align: center; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--card-shadow, none);
  }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card h2 .hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-muted); }

  /* ---------- PNL tiles ---------- */
  .tiles-head { display: flex; justify-content: flex-end; margin-bottom: -6px; }
  #tilesPop { position: fixed; z-index: 200; min-width: 220px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.20); padding: 14px; display: none; }
  /* Must come before .field: an author display rule beats the UA stylesheet's
     [hidden] { display: none }, so a .field marked hidden stayed on screen.
     That is why the UL-only "Target premium" box showed on every product. */
  [hidden] { display: none !important; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-muted); }
  select, input[type="date"], input[type="text"], input[type="number"],
  input[type="email"], input[type="password"], input[type="search"], input[type="tel"] {
    font: inherit; font-size: 14px;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--baseline);
    border-radius: 7px;
    padding: 7px 9px;
  }
  input.narrow { width: 108px; }
  input.wide { width: 170px; }
  .check { display: flex; align-items: center; gap: 6px; padding: 8px 0; font-size: 14px; color: var(--text-secondary); }
  .check input { width: 16px; height: 16px; accent-color: var(--series-1); }
  .btn {
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid var(--series-1);
    background: var(--series-1);
    color: #fff;
    cursor: pointer;
  }
  .btn.secondary {
    background: transparent;
    color: var(--text-secondary);
    border-color: var(--baseline);
  }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .btn.icon {
    background: transparent; border-color: var(--baseline); color: var(--text-secondary);
    padding: 5px 10px; font-size: 14px; line-height: 1;
  }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 7px 10px; text-align: left; white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--baseline); }
  td { border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.notes { max-width: 210px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             color: var(--text-secondary); font-size: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .card-head h2 { margin-bottom: 0; }
  .empty { color: var(--text-muted); font-size: 14px; padding: 10px 0; }
  .row-actions { display: flex; gap: 6px; }
  .muted-cell { color: var(--text-muted); }
  .paid-tick { color: var(--good); font-weight: 700; }

  .acct-box { display: none; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); }
  .acct-box.show { display: flex; }
  .toolbar { justify-content: space-between; }
  .side-controls { display: flex; align-items: center; gap: 6px; margin-left: auto;
                   padding-left: 10px; border-left: 1px solid var(--border); }
  #acctEmail { display: none; }
  #morePop { position: fixed; z-index: 200; min-width: 170px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.20); padding: 8px; display: none; }
  #morePop.show { display: block; }
  #morePop button { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 7px; border: none; background: transparent; color: var(--text-primary); cursor: pointer; }
  #morePop button:hover { background: var(--page); }
  #moreBackdrop { position: fixed; inset: 0; z-index: 199; display: none; }
  #moreBackdrop.show { display: block; }
  .sync-pill {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--grid); color: var(--text-muted); white-space: nowrap;
  }
  .sync-pill.saving { color: var(--series-1); border-color: var(--series-1); }
  .sync-pill.saved { color: var(--good); border-color: var(--good); }
  .sync-pill.err { color: var(--danger); border-color: var(--danger); }

  .paid-yes { color: var(--good); font-weight: 600; }
  /* -- book of business -- */
  .sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sheet-x { margin-left: auto; background: none; border: none; color: var(--text-muted);
             font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .form-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .deal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 110; display: none; }
  .deal-scrim.show { display: block; }
  .deal-sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 111;
                background: var(--surface-1); border-left: 1px solid var(--border);
                padding: 20px; overflow-y: auto; transform: translateX(102%);
                transition: transform .18s ease; }
  .deal-sheet.show { transform: none; }
  .deal-sheet > .card { border: none; box-shadow: none; padding: 4px; }
  .deal-sheet .field .wide { width: 100%; }
  .deal-sheet .field { flex: 1 1 180px; }
  .deal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .book-search { margin: 4px 0 14px; }
  .book-search input { width: 100%; max-width: 420px; -webkit-appearance: none; appearance: none; }
  #bookTable tbody tr { cursor: pointer; }
  #bookTable tbody tr:hover { background: var(--page); }
  .ben-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
             padding: 10px 0; border-bottom: 1px dashed var(--grid); }
  .ben-row:last-child { border-bottom: none; }
  .ben-row .field { flex: 1 1 120px; }
  .ben-row .pct { width: 76px; }
  .ben-row .x { background: transparent; border: none; color: var(--text-muted);
                font-size: 20px; cursor: pointer; padding: 0 6px; line-height: 1; }
  .ben-sec { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--grid); }
  .ben-total { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
  .ben-total.over { color: var(--danger); }
  .client-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; }
  .client-head h2 { margin: 0; font-size: 18px; text-transform: none; letter-spacing: 0;
                    color: var(--text-primary); }
  .client-facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 0 4px;
                  font-size: 13px; color: var(--text-muted); }
  .client-facts b { color: var(--text-primary); font-weight: 600; }
  .client-sec { margin-top: 18px; }
  .client-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
                   color: var(--text-muted); margin: 0 0 8px; }
  header { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  textarea {
    font: inherit; font-size: 14px; color: var(--text-primary);
    background: var(--page); border: 1px solid var(--baseline);
    border-radius: 7px; padding: 8px 9px; width: 100%; resize: vertical;
  }
  .field.grow { flex: 1 1 100%; }
  .note-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .sensitive-sec .form-grid .field { flex: 1 1 180px; }
  .com-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .com-note { font-size: 12px; color: var(--text-muted); }
  .com-note.warn { color: var(--danger); }
  .for-client { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .for-client b { color: var(--text-primary); }

  /* ---------- the client record, full screen ---------- */
  .client-screen {
    position: fixed; inset: 0; z-index: 95; background: var(--page);
    overflow-y: auto; padding: 0;
  }
  .client-screen[hidden] { display: none; }
  .cs-bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 13px 26px; background: var(--surface-1);
    border-bottom: 1px solid var(--border);
  }
  .cs-back {
    display: inline-flex; align-items: center; gap: 4px;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    background: transparent; border: 1px solid var(--baseline);
    color: var(--text-secondary); border-radius: 8px;
    padding: 7px 13px 7px 9px; margin-right: 4px; flex: none;
  }
  .cs-back:hover { color: var(--text-primary); border-color: var(--text-muted); }
  .cs-back svg {
    width: 16px; height: 16px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .cs-bar h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .cs-sub { font-size: 13px; color: var(--text-muted); }
  .cs-bar .spacer { margin-left: auto; }
  .cs-body { max-width: 1180px; margin: 0 auto; padding: 20px 26px 48px;
             display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
  .cs-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .cs-stat { display: flex; gap: 26px; flex-wrap: wrap; }
  .cs-stat .s-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .cs-stat .s-value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 14px; }
  .kv dt { color: var(--text-muted); white-space: nowrap; }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .note-body { font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-secondary); }

  /* A masked value is the resting state. Revealing is a deliberate act, and it
     times out on its own so a record left open on a desk stops showing an SSN. */
  .secret { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .secret code { font: inherit; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .reveal {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    background: transparent; border: 1px solid var(--baseline);
    color: var(--text-secondary); border-radius: 999px; padding: 2px 10px;
  }
  .reveal:hover { color: var(--text-primary); }

  @media (max-width: 900px) {
    .cs-body { grid-template-columns: 1fr; padding: 14px 14px 40px; }
    .cs-bar { padding: 11px 14px; }
  }
  @media (max-width: 760px) {
    .book-search input { max-width: none; }
    th, td { padding: 8px 8px; }
  }

</style>
<style>
  /* ---------- activity ---------- */
  .seg-wrap { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--border);
              background: var(--surface-1); border-radius: 9px; }
  .seg { font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: none;
         background: transparent; color: var(--text-secondary); border-radius: 7px; padding: 6px 14px; }
  .seg.on { background: var(--series-1); color: #fff; }
  .seg:hover:not(.on) { color: var(--text-primary); }

  .period-note { font-size: 12.5px; color: var(--text-muted); margin-top: -4px; }

  .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .metric {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 18px 18px; text-align: center; box-shadow: var(--card-shadow, none);
  }
  /* Dials is the number entered most, so it gets the width and the accent. */
  .metric.hero {
    grid-column: 1 / -1;
    background: var(--series-1); border-color: var(--series-1);
  }
  .m-label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
             color: var(--text-muted); }
  .m-hint { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .metric.hero .m-label, .metric.hero .m-hint { color: rgba(255,255,255,.82); }

  .metric input.m-input {
    display: block; width: 100%; margin: 10px auto 0; padding: 2px 0;
    font: inherit; font-size: 46px; font-weight: 700; line-height: 1.05;
    font-variant-numeric: tabular-nums; text-align: center; letter-spacing: -0.02em;
    color: var(--text-primary); background: transparent; border: none; border-radius: 8px;
  }
  .metric.hero input.m-input { font-size: 64px; color: #fff; }
  .metric input.m-input::placeholder { color: var(--text-muted); opacity: 1; }
  .metric.hero input.m-input::placeholder { color: rgba(255,255,255,.55); }
  .metric input.m-input:focus,
  .metric input.m-input:focus-visible { outline: none; box-shadow: none; border: none; }
  /* The spinners are the thing this page exists to get rid of. */
  .metric input.m-input::-webkit-outer-spin-button, .metric input.m-input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .metric input.m-input[type=number] { -moz-appearance: textfield; appearance: textfield; }

  .m-sub { font-size: 12px; color: var(--text-muted); min-height: 16px; margin-top: 6px; }
  .metric.hero .m-sub { color: rgba(255,255,255,.8); }

  .summary { font-size: 13px; color: var(--text-muted); }

  @media (max-width: 700px) {
    .metrics { grid-template-columns: minmax(0, 1fr); }
    .metric input.m-input { font-size: 40px; }
    .metric.hero input.m-input { font-size: 54px; }
  }
</style>
